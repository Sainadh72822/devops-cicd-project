apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo-app
  template:
    metadata:
      labels:
        app: devops-demo-app
    spec:
      containers:
        - name: devops-demo-app
          image: 044014415078.dkr.ecr.us-east-1.amazonaws.com/devops-demo-app:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
